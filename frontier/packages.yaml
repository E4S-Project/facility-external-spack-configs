packages:
  all:
    providers:
      blas:: [cray-libsci]
      lapack:: [cray-libsci]
      mpi:: [cray-mpich]
      libllvm:: [llvm-amdgpu]
      gl:: [osmesa]
  cce:
    buildable: false
    externals:
    - spec: cce@14.0.2
      modules:
      - PrgEnv-cray
      - cce/14.0.2
      - xpmem
      - craype-x86-trento
      - libfabric
      - cray-pmi/6.1.8
      extra_attributes:
        environment:
          set:
            RFE_811452_DISABLE: '1'
            HIPCC: CC
          append_path:
            PKG_CONFIG_PATH: /opt/cray/xpmem/2.5.2-2.4_3.45__gd0f7936.shasta/lib64/pkgconfig:/usr/lib64/pkgconfig
            LD_LIBRARY_PATH: /opt/cray/pe/gcc-libs:/opt/cray/libfabric/1.15.2.0/lib64
          prepend_path:
            LD_LIBRARY_PATH: /opt/cray/pe/pmi/6.1.8/lib
        extra_rpaths:
        - /opt/cray/pe/gcc-libs
        - /opt/cray/gcc-libs
    - spec: cce@15.0.0
      modules:
      - PrgEnv-cray
      - cce/15.0.0
      - xpmem
      - craype-x86-trento
      - libfabric
      - cray-pmi/6.1.8
      extra_attributes:
        environment:
          set:
            RFE_811452_DISABLE: '1'
            HIPCC: CC
          append_path:
            PKG_CONFIG_PATH: /opt/cray/xpmem/2.5.2-2.4_3.45__gd0f7936.shasta/lib64/pkgconfig:/usr/lib64/pkgconfig
            LD_LIBRARY_PATH: /opt/cray/pe/gcc-libs:/opt/cray/libfabric/1.15.2.0/lib64
          prepend_path:
            LD_LIBRARY_PATH: /opt/cray/pe/pmi/6.1.8/lib
        extra_rpaths:
        - /opt/cray/pe/gcc-libs
        - /opt/cray/gcc-libs
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.2.1-native
      modules:
      - PrgEnv-gnu
      - gcc-native/13.2
      - xpmem
      - craype-x86-trento
      - libfabric
      - cray-pmi/6.1.8
      extra_attributes:
        environment:
          append_path:
            PKG_CONFIG_PATH: /opt/cray/xpmem/2.5.2-2.4_3.45__gd0f7936.shasta/lib64/pkgconfig:/usr/lib64/pkgconfig

    - spec: gcc@12.2.0
      modules:
      - PrgEnv-gnu
      - gcc/12.2.0
      - xpmem
      - craype-x86-trento
      - libfabric
      - cray-pmi/6.1.8
      extra_attributes:
        compilers:
          c: gcc
          cxx: g++
          fortran: gfortran
        environment:
          append_path:
            PKG_CONFIG_PATH: /opt/cray/xpmem/2.5.2-2.4_3.45__gd0f7936.shasta/lib64/pkgconfig:/usr/lib64/pkgconfig

    - spec: gcc@11.2.0
      modules:
      - PrgEnv-gnu
      - gcc/11.2.0
      - xpmem
      - craype-x86-trento
      - libfabric
      - cray-pmi/6.1.8
      extra_attributes:
        environment:
          append_path:
            PKG_CONFIG_PATH: /opt/cray/xpmem/2.5.2-2.4_3.45__gd0f7936.shasta/lib64/pkgconfig:/usr/lib64/pkgconfig

    - spec: gcc@7.5.0-system
      prefix: /usr/
      extra_attributes:
        environment:
          append_path:
            PKG_CONFIG_PATH: /usr/lib64/pkgconfig

  # System packages
  openssh:
    buildable: false
    externals:
    - spec: "openssh@8.4p1"
      prefix: /usr
  openssl:
    buildable: false
    externals:
    - spec: "openssl@1.1.1l"
      prefix: /usr

  cmake:
    require:
    - ~ownlibs~doc+ncurses
  # Cray provided packages
  cray-libsci:
    buildable: false
    externals:
    - spec: cray-libsci@22.12.1.1 +openmp+mpi
      modules: [cray-libsci/22.12.1.1]
    - spec: cray-libsci@24.11.0 +openmp+mpi
      modules: [cray-libsci/24.11.0]
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@8.1.31 %gcc
      prefix: /opt/cray/pe/mpich/8.1.31/ofi/gnu/12.3
      modules:
      - cray-mpich/8.1.31
      - libfabric/1.22.0
    - spec: cray-mpich@8.1.31 %cce
      prefix: /opt/cray/pe/mpich/8.1.31/ofi/crayclang/17.0
      modules:
      - cray-mpich/8.1.31
      - libfabric/1.22.0
    - spec: cray-mpich@8.1.23 %gcc
      prefix: /opt/cray/pe/mpich/8.1.23/ofi/gnu/9.1
      modules:
      - cray-mpich/8.1.23
      - libfabric/1.22.0
    - spec: cray-mpich@8.1.23 %cce
      prefix: /opt/cray/pe/mpich/8.1.23/ofi/crayclang/10.0
      modules:
      - cray-mpich/8.1.23
      - libfabric/1.22.0
    - spec: cray-mpich@8.1.17 %clang@15.0.0-rocm5.3.0
      prefix: /opt/cray/pe/mpich/8.1.23/ofi/amd/5.0
      modules:
      - cray-mpich/8.1.23
      - libfabric/1.22.0
    - spec: cray-mpich@8.1.17 %clang@15.0.0-rocm5.4.3
      prefix: /opt/cray/pe/mpich/8.1.23/ofi/amd/5.0
      modules:
      - cray-mpich/8.1.23
      - libfabric/1.22.0
  libfabric:
    buildable: false
    externals:
    - spec: libfabric@1.22.0
      modules:
      - libfabric/1.22.0
  # libffi:
  #   # py-cffi requires libffi.so.8 which is not on this system
  #   buildable: false
  #   externals:
  #   - spec: libffi@3
  #     prefix: /usr
  paraview:
    require:
    - ~qt ^[virtuals=gl] osmesa
  mesa:
    require:
    - +llvm~glx+osmesa
  ncurses:
    buildable: false
    externals:
    - spec: ncurses@6.4-system~symlinks+termlib
      prefix: /usr/
  visit:
    require: ~gui ^[virtuals=gl] osmesa
