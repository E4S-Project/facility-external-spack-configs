      modules:
      - rocm/7.0.2
  rocblas:
    buildable: false
    externals:
    - spec: rocblas@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  rocfft:
    buildable: false
    externals:
    - spec: rocfft@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  rocm-clang-ocl:
    buildable: false
    externals:
    - spec: rocm-clang-ocl@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  rocm-cmake:
    buildable: false
    externals:
    - spec: rocm-cmake@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
