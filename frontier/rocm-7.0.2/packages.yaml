  rocm-dbgapi:
    buildable: false
    externals:
    - spec: rocm-dbgapi@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  rocm-debug-agent:
    buildable: false
    externals:
    - spec: rocm-debug-agent@7.0.2
