packages:
  # General requirements
  all:
    providers:
      blas:: [cray-libsci]
      mpi:: [cray-mpich]
      libllvm:: [llvm-amdgpu]
      gl:: [osmesa]

  # Specific package requirements
  cmake:
    require:
    - ~ownlibs~doc+ncurses
  paraview:
    require:
    - ~qt ^[virtuals=gl] osmesa
  mesa:
    require:
    - +llvm~glx+osmesa
  visit:
    require: ~gui ^[virtuals=gl] osmesa

  # System packages that are compatible with ROCm 7.0.2
  gcc:
    externals:
    - spec: gcc@14.2.0 languages:='c,c++,fortran'
      prefix: /usr
      modules:
        - gcc-native/14.2
        - craype/2.7.35
        - cray-dsmml/0.3.1
        - PrgEnv-gnu/8.6.0
        - rocm/7.0.2
        - cray-mpich/9.1.0
        - cray-libsci/25.09.0
        - craype-x86-trento
        - cray-pmi/6.1.16
        - libfabric/2.3.1
        - xpmem/1.0.1-1.5_1_gfb6998056825
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-14
          cxx: /usr/bin/g++-14
          fortran: /usr/bin/gfortran-14
  openssh:
    buildable: false
    externals:
    - spec: openssh@8.4p1
      prefix: /usr
  openssl:
    buildable: false
    externals:
    - spec: openssl@1.1.1l
      prefix: /usr
  ncurses:
    buildable: false
    externals:
    - spec: ncurses@6.4-system~symlinks+termlib
      prefix: /usr/

  # Cray provided packages that are compatible with ROCm 7.0.2
  cray-libsci:
    buildable: false
    externals:
    - spec: cray-libsci@24.11.0 +openmp+mpi
      modules: [cray-libsci/24.11.0]
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.1.0
      prefix: /opt/cray/pe/mpich/9.1.0/ofi/amd/7.0
      modules:
      - craype-network-ofi
      - craype/2.7.35
      - amd/7.0.2
      - rocm/7.0.2
      - cray-mpich/9.1.0
      - libfabric/2.3.1
      extra_attributes:
        environment:
          set:
            MPICH_GPU_SUPPORT_ENABLED: "1"
            CFLAGS: -I/opt/cray/pe/mpich/9.1.0/ofi/crayclang/20.0/include -L/opt/cray/pe/mpich/9.1.0/ofi/crayclang/20.0/lib -lmpi -L/opt/cray/pe/mpich/9.1.0/gtl/lib -lmpi_gtl_hsa
            CXXFLAGS: -I/opt/cray/pe/mpich/9.1.0/ofi/crayclang/20.0/include -L/opt/cray/pe/mpich/9.1.0/ofi/crayclang/20.0/lib -lmpi -L/opt/cray/pe/mpich/9.1.0/gtl/lib -lmpi_gtl_hsa
            HIPFLAGS: -I/opt/cray/pe/mpich/9.1.0/ofi/crayclang/20.0/include -L/opt/cray/pe/mpich/9.1.0/ofi/crayclang/20.0/lib -lmpi -L/opt/cray/pe/mpich/9.1.0/gtl/lib -lmpi_gtl_hsa
  libfabric:
    buildable: false
    externals:
    - spec: libfabric@1.20.1
      modules:
      - libfabric/2.3.1

  # ROCm 7.0.2 packages
  comgr:
    buildable: false
    externals:
    - spec: comgr@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  hip-rocclr:
    buildable: false
    externals:
    - spec: hip-rocclr@7.0.2
      prefix: /opt/rocm-7.0.2
      modules:
      - rocm/7.0.2
  hipblas:
    buildable: false
    externals:
    - spec: hipblas@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  hipcub:
    buildable: false
    externals:
    - spec: hipcub@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  hipfft:
    buildable: false
    externals:
    - spec: hipfft@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  hipsparse:
    buildable: false
    externals:
    - spec: hipsparse@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  miopen-hip:
    buildable: false
    externals:
    - spec: miopen-hip@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  miopengemm:
