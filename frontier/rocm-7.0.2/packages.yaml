  rocm-smi-lib:
    buildable: false
    externals:
    - spec: rocm-smi-lib@7.0.2
      prefix: /opt/rocm-7.0.2/
      modules:
      - rocm/7.0.2
  hip:
    buildable: false
    externals:
    - spec: hip@7.0.2
      prefix: /opt/rocm-7.0.2
      modules:
      - craype-accel-amd-gfx90a
      - rocm/7.0.2
      extra_attributes:
        compilers:
          c: /opt/rocm-7.0.2/llvm/bin/clang
          c++: /opt/rocm-7.0.2/llvm/bin/clang++
          fortran: /opt/rocm-7.0.2/llvm/bin/flang
          hip: /opt/rocm-7.0.2/bin/hipcc
        environment:
          set:
            MPICH_GPU_SUPPORT_ENABLED: "1"
  llvm-amdgpu:
    buildable: false
    externals:
    - spec: llvm-amdgpu@7.0.2 languages:='c,c++,fortran'
      prefix: /opt/rocm-7.0.2/llvm
      modules:
      - rocm/7.0.2
      - craype/2.7.35
      - cray-dsmml/0.3.1
      - amd/7.0.2
      - craype-network-ofi
      - PrgEnv-amd
      - cray-mpich/9.1.0
      - craype-x86-trento
      - cray-libsci/26.03.0 
      - cray-pmi/6.1.16
      - libfabric/2.3.1
      - xpmem/1.0.1-1.5_1_gfb6998056825
      extra_attributes:
        compilers:
          c: /opt/rocm-7.0.2/llvm/bin/clang
          cxx: /opt/rocm-7.0.2/llvm/bin/clang++
          fortran: /opt/rocm-7.0.2/llvm/bin/flang
  hsakmt-roct:
    buildable: false
